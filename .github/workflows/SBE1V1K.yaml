name: Build OpenWrt SBE1V1K IPQ95xx
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: # 支持手动点击触发编译（推荐）

env:
  TARGET_PROFILE: qualcommbe_ipq95xx
  TARGET_ARCH: aarch64_cortex-a53
  BUILD_ROOT: ${{ github.workspace }}/openwrt
  CCACHE_DIR: ${{ github.workspace }}/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache flex bison gawk python3 python3-pip unzip libncurses-dev libssl-dev wget rsync git libelf-dev

      - name: Restore cache (dl + build_dir + staging_dir + ccache)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_ROOT }}/dl
            ${{ env.BUILD_ROOT }}/build_dir
            ${{ env.BUILD_ROOT }}/staging_dir
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-openwrt-sbe1v1k-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-sbe1v1k-

      - name: Prepare build env
        run: |
          cd ${{ env.BUILD_ROOT }}
          # 开启ccache
          echo "export CCACHE_DIR=${{ env.CCACHE_DIR }}" >> ~/.bashrc
          echo "export PATH=/usr/lib/ccache:$PATH" >> ~/.bashrc
          source ~/.bashrc
          ccache -M 5G
          ccache -s

      - name: Update feeds & load config
        run: |
          cd ${{ env.BUILD_ROOT }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 把你的 .config 放到源码根目录，名字 .config
          cp .config .config.old
          make defconfig

      - name: Build OpenWrt (incremental compile)
        run: |
          cd ${{ env.BUILD_ROOT }}
          # 如果你只是删除bin目录重建，只打包ipk+镜像，注释掉下面这行make，改用package/compile
          # make -j$(nproc)
          make package/compile -j$(nproc)
          make target/image -j$(nproc)
          make package/index

      - name: Package firmware & packages
        run: |
          cd ${{ env.BUILD_ROOT }}
          # 打包固件镜像
          tar -zcvf firmware.tar.gz bin/target/${{ env.TARGET_PROFILE }}
          # 打包软件包仓库（含APKINDEX ADBv3）
          tar -zcvf packages.tar.gz bin/packages/${{ env.TARGET_ARCH }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: ${{ env.BUILD_ROOT }}/firmware.tar.gz
          retention-days: 7

      - name: Upload packages repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages
          path: ${{ env.BUILD_ROOT }}/packages.tar.gz
          retention-days: 7
