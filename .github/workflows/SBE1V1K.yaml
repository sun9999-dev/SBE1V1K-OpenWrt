name: Build SBE1V1K IPQ95xx OpenWrt
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 编译类型
        required: true
        default: all
        type: choice
        options:
          - all
          - initramfs-only
          - config-only
env:
  REPO_URL: https://github.com/sun9999-dev/SBE1V1K-OpenWrt.git
  REPO_BRANCH: main
  TARGET_PROFILE: askey_sbe1v1k

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Show build option
        run: |
          echo "Build type: ${{ github.event.inputs.build_type }}"
          
      - name: Init Env & Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget libelf-dev ccache
          git clone $REPO_URL openwrt --single-branch --branch $REPO_BRANCH
          cd openwrt
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-
      
      - name: Update feeds & build .config
        run: |
          cd openwrt
          ./scripts/feeds update -a
          rm -rf feeds/packages/net/nftables-nojson
          ./scripts/feeds install -a
          # 直接删除tmp里对应的坏Kconfig行，干掉递归依赖
          sed -i '/PACKAGE_nftables-nojson/d' tmp/.config-package.in
      - name: Generate .config
        run: |
            cd openwrt
            cp sbe1v1k.config .config
            # CI环境必须用defconfig，不要olddefconfig！
            make defconfig
            echo "===== Check critical drivers ====="
            grep -E "kmod-pcs-qcom-ipq9574|kmod-qcom-ppe|kmod-ath12k|kmod-phylink" .config
            echo "Total enabled kmod packages:"
            grep 'CONFIG_PACKAGE' .config | grep -E '=m|=y' | wc -l
      - name: Compile firmware
        id: build_step
        # 调试阶段关闭continue-on-error，出错直接终止，不要生成残缺包
        # continue-on-error: true
        run: |
          cd openwrt
          rm -rf bin
          if [[ "${{ github.event.inputs.build_type }}" == "config-only" ]]; then
            echo "仅生成配置，跳过编译"
            exit 0
          fi
          if [[ "${{ github.event.inputs.build_type }}" == "initramfs-only" ]]; then
             make -j$(nproc) image PROFILE=${{ env.TARGET_PROFILE }} FILES= bin/initramfs
          else
             make -j$(nproc)
          fi
          
      - name: SSHX debug on failure
        if: ${{ failure() }}
        run: curl -sSf https://sshx.io/get | sh -s run     
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sbe1v1k-firmware
          path: openwrt/bin/targets
          retention-days: 7
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sbe1v1k-packages
          path: openwrt/bin/packages
          retention-days: 7
