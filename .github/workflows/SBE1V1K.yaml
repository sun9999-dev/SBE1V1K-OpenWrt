name: Build SBE1V1K IPQ95xx OpenWrt
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/sun9999-dev/SBE1V1K-OpenWrt.git
  REPO_BRANCH: main
  FEED_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_SH: diy.sh

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget libelf-dev ccache
          git clone $REPO_URL openwrt --single-branch --branch $REPO_BRANCH
          cd openwrt

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          rm -rf feeds/video
          ./scripts/feeds install -a
          cp ../${CONFIG_FILE} .config
          make defconfig

      - name: Compile firmware
        run: |
          cd openwrt
          rm -rf bin
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sbe1v1k-firmware
          path: openwrt/bin
          retention-days: 7
