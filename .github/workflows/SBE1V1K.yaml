name: Build SBE1V1K IPQ95xx OpenWrt
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  REPO_URL: https://github.com/sun9999-dev/SBE1V1K-OpenWrt.git
  REPO_BRANCH: main
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Init Env & Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget libelf-dev ccache
          git clone $REPO_URL openwrt --single-branch --branch $REPO_BRANCH
          cd openwrt
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-
      
      - name: Update feeds & build .config
        run: |
          cd openwrt
          ./scripts/feeds update -a
          rm -rf feeds/video
          rm -rf feeds/packages/net/nftables-nojson
          ./scripts/feeds install -a
          # 复制平台基础配置
          > .config
          cat configs/sbe1v1k.config > .config
          # 一次性生成config
          make defconfig
          # sed：所有注释关闭的kmod，取消注释并改为=m；已有配置完全不动
          sed -i '/^# CONFIG_PACKAGE_kmod-.*is not set$/ s/^# //; s/is not set/=m/' .config
          # 统计
          echo "=== 筛选所有=m的kmod配置行 ==="
          grep 'CONFIG_PACKAGE_kmod-' .config | grep '=m'
          echo "=== 最终启用的kmod包数量 ==="
          grep 'CONFIG_PACKAGE_kmod-' .config | grep '=m' | wc -l

      - name: Compile firmware & kmod packages
        id: build_step
        run: |
          set -e
          cd openwrt
          rm -rf bin
          make -j$(nproc) IGNORE_ERRORS="n m"
        continue-on-error: true
        
      - name: Tmate on build failure
        if: steps.build_step.outcome == 'failure'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          sudo: auto
          install-dependencies: true
          # 延长超时时间到30分钟=1800秒
          connect-timeout-seconds: 1800
      # 通配符自动匹配目录
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sbe1v1k-firmware
          path: openwrt/bin/targets
          retention-days: 7
      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-sbe1v1k-packages
          path: openwrt/bin/packages
          retention-days: 7
